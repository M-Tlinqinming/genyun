# 预览环境：应用 + PostgreSQL + Caddy（自动 HTTPS）
# 在服务器 /opt/genyun/src/deploy/preview 下运行，密钥在 /opt/genyun/.env（不进仓库）
name: genyun-preview

services:
  app:
    build: ../..
    image: genyun:preview
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://genyun:${POSTGRES_PASSWORD}@db:5432/genyun
      FILE_STORAGE_DIR: /data/files
      FILE_URL_SECRET: ${FILE_URL_SECRET}
    volumes:
      - files:/data/files
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: genyun
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: genyun
    volumes:
      - db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U genyun -d genyun"]
      interval: 5s
      timeout: 3s
      retries: 20

  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      SITE_DOMAIN: ${SITE_DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app

volumes:
  db:
  files:
  caddy_data:
  caddy_config:
