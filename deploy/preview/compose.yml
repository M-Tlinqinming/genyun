# 预览环境：应用 + PostgreSQL + Redis（草稿生成队列）+ Caddy（自动 HTTPS）
# 在服务器 /opt/genyun/src/deploy/preview 下运行，密钥在 /opt/genyun/.env（不进仓库）
name: genyun-preview

services:
  app:
    build: ../..
    image: genyun:preview
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://genyun:${POSTGRES_PASSWORD}@db:5432/genyun
      FILE_STORAGE_DIR: /data/files
      FILE_URL_SECRET: ${FILE_URL_SECRET}
      # AI 起草（阿里云百炼）；不填 AI_DRAFTER 则不用 AI
      AI_DRAFTER: ${AI_DRAFTER:-}
      DASHSCOPE_API_KEY: ${DASHSCOPE_API_KEY:-}
      AI_MODEL: ${AI_MODEL:-qwen3.8-flash}
      AI_BASE_URL: ${AI_BASE_URL:-}
      # 草稿生成队列（BullMQ），服务重启后没跑完的继续
      REDIS_URL: redis://redis:6379
    volumes:
      - files:/data/files
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  redis:
    image: redis:8
    restart: unless-stopped
    # BullMQ 要求不淘汰键；开 AOF，重启不丢队列
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    volumes:
      - redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: genyun
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: genyun
    volumes:
      - db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U genyun -d genyun"]
      interval: 5s
      timeout: 3s
      retries: 20

  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      SITE_DOMAIN: ${SITE_DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app

volumes:
  db:
  files:
  redis:
  caddy_data:
  caddy_config:
