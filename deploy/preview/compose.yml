# 预览环境：应用 + PostgreSQL + Redis（草稿生成队列）+ Caddy（自动 HTTPS，同时托管官网）
# 在服务器 /opt/genyun/src/deploy/preview 下运行，密钥在 /opt/genyun/.env（不进仓库）
name: genyun-preview

services:
  app:
    build: ../..
    image: genyun:preview
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://genyun:${POSTGRES_PASSWORD}@db:5432/genyun
      FILE_STORAGE_DIR: /data/files
      FILE_URL_SECRET: ${FILE_URL_SECRET}
      # AI 起草（阿里云百炼）；不填 AI_DRAFTER 则不用 AI
      AI_DRAFTER: ${AI_DRAFTER:-}
      DASHSCOPE_API_KEY: ${DASHSCOPE_API_KEY:-}
      AI_MODEL: ${AI_MODEL:-qwen3.8-flash}
      AI_BASE_URL: ${AI_BASE_URL:-}
      # 草稿生成队列（BullMQ），服务重启后没跑完的继续
      REDIS_URL: redis://redis:6379
      # 邮件里的链接（邀请、找回密码）指向这个地址
      APP_ORIGIN: https://${SITE_DOMAIN}
      # 预览环境默认模拟发信：邮件写进发件箱目录（数据卷），运营在 /operator/mail-outbox 查看，见 README「查看模拟发信」。
      # 要真发时在 /opt/genyun/.env 设 MAIL_DRIVER=aliyun 和下面三项凭据（这时模拟发件箱关闭）
      MAIL_DRIVER: ${MAIL_DRIVER:-mock}
      MAIL_OUTBOX_DIR: /data/mail-outbox
      ALIYUN_DM_ACCESS_KEY_ID: ${ALIYUN_DM_ACCESS_KEY_ID:-}
      ALIYUN_DM_ACCESS_KEY_SECRET: ${ALIYUN_DM_ACCESS_KEY_SECRET:-}
      ALIYUN_DM_ACCOUNT_NAME: ${ALIYUN_DM_ACCOUNT_NAME:-}
      ALIYUN_DM_FROM_ALIAS: ${ALIYUN_DM_FROM_ALIAS:-耕云}
    volumes:
      - files:/data/files
      - mail_outbox:/data/mail-outbox
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  redis:
    image: redis:8
    restart: unless-stopped
    # BullMQ 要求不淘汰键；开 AOF，重启不丢队列
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    volumes:
      - redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: genyun
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: genyun
    volumes:
      - db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U genyun -d genyun"]
      interval: 5s
      timeout: 3s
      retries: 20

  # 反向代理 + 官网静态页（site.Dockerfile）：业务路径转给 app，其余是官网，见 Caddyfile
  caddy:
    build:
      context: ../..
      dockerfile: deploy/preview/site.Dockerfile
      args:
        SITE_URL: https://${SITE_DOMAIN}
    image: genyun-site:preview
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      SITE_DOMAIN: ${SITE_DOMAIN}
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app

volumes:
  db:
  files:
  mail_outbox:
  redis:
  caddy_data:
  caddy_config:
