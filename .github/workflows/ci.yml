name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    name: 类型检查与测试
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7

  image:
    name: 构建 Docker 镜像
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t genyun:${{ github.sha }} .
      - name: 冒烟测试
        run: |
          # 正式环境必须有 Redis（草稿生成队列），与预览环境一样起一个
          docker network create smoke
          docker run -d --name redis --network smoke redis:8
          docker run -d --name app --network smoke -e DATABASE_URL=/tmp/db -e FILE_STORAGE_DIR=/tmp/files -e FILE_URL_SECRET=ci-smoke-test -e REDIS_URL=redis://redis:6379 -p 3000:3000 genyun:${{ github.sha }}
          for i in $(seq 1 30); do curl -sf localhost:3000/api/health && break; sleep 1; done
          curl -sf localhost:3000/api/health || (docker logs app; exit 1)
          curl -sf localhost:3000/login | grep -q '<div id="root">'
